<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>América do Sul</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belleza&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tela-boas-vindas">
        <img src="IMAGENS/foto13.jpg" alt="Plantas Cima" class="planta-fixa planta-topo-horizontal">
        <img src="IMAGENS/foto6.jpg" alt="Plantas Baixo" class="planta-fixa planta-baixo-horizontal">
        <img src="IMAGENS/foto7.jpg" alt="Planta Esquerda" class="planta-fixa planta-esquerda-vertical">
        <img src="IMAGENS/foto8.jpg" alt="Planta Esquina Direita" class="planta-fixa planta-esquina-direita">

        <div class="conteudo-central-intro">
            <h1 class="texto-boas-vindas">Seja Bem-vindo</h1>
            <p class="subtexto-intro">À vibrante América do Sul...</p>
        </div>
    </div>

    <header class="topo-imagem">
        <h1 class="titulo-esboco">
            América do Sul <br>
            <span class="subtitulo-continente">Aventure-se no nosso sazón</span>
        </h1>
        <div class="lado-direito-limpo"></div>
    </header>

    <nav class="barra-abas">
        <div class="icone-mapa" title="América do Sul">🦋</div>
        
        <button class="botao-acao-navegar" onclick="toggleBandeiras()">Navegar 👉🏾</button>
        
        <div id="fileiraPaises" class="fileira-bandeiras escondido">
            <img src="https://flagcdn.com/w40/br.png" alt="Brasil" title="Brasil" class="desenho-bandeira" onclick="selecionarPais('brasil')">
            <img src="https://flagcdn.com/w40/ar.png" alt="Argentina" title="Argentina" class="desenho-bandeira" onclick="selecionarPais('argentina')">
            <img src="https://flagcdn.com/w40/bo.png" alt="Bolívia" title="Bolívia" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/cl.png" alt="Chile" title="Chile" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/co.png" alt="Colômbia" title="Colômbia" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/ec.png" alt="Equador" title="Equador" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/gy.png" alt="Guiana" title="Guiana" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/py.png" alt="Paraguai" title="Paraguai" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/pe.png" alt="Peru" title="Peru" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/sr.png" alt="Suriname" title="Suriname" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/uy.png" alt="Uruguai" title="Uruguai" class="desenho-bandeira">
            <img src="https://flagcdn.com/w40/ve.png" alt="Venezuela" title="Venezuela" class="desenho-bandeira">
        </div>
    </nav>

    <div class="divisao-layout">
        
        <aside class="coluna-botoes">
            <button class="botao-circulo" title="Página Inicial" onclick="mudarCategoria('inicio')">🏠</button>
            <button class="botao-circulo" title="Gastronomia" onclick="mudarCategoria('gastronomia')">🌮</button>
            <button class="botao-circulo" title="Destinos" onclick="mudarCategoria('destinos')">✈️</button>
            <button class="botao-circulo" title="Festas Populares" onclick="mudarCategoria('festas')">🎉</button>
            <button class="botao-circulo" title="Ritmo e Música" onclick="mudarCategoria('musica')">🎵</button>
        </aside>

        <main class="espaco-leitura">
            <div class="caixa-manifesto">
                <h2 class="titulo-manifesto" id="titulo-pagina">O Coração Pulsante do Mundo</h2>
                <p class="subtitulo-manifesto" id="subtitulo-pagina">Muito além dos mapas: uma viagem de arrepiar pelos sabores, ritmos e cores do continente mais vivo do planeta.</p>
                
                <div id="corpo-texto">
                    </div>
            </div>
        </main>

    </div>

    <script>
        function toggleBandeiras() {
            var fileira = document.getElementById("fileiraPaises");
            fileira.classList.toggle("escondido");
        }

        setTimeout(function() {
            var telaIntro = document.getElementById("tela-boas-vindas");
            telaIntro.style.opacity = "0";
            telaIntro.style.transition = "opacity 800ms ease";
            setTimeout(function() {
                telaIntro.style.display = "none";
            }, 800);
        }, 2200);

        var paisSelecionado = "geral";

        var conteudoGeral = {
            inicio: {
                titulo: "O Coração Pulsante do Mundo",
                subtitulo: "Muito além dos mapas: uma viagem de arrepiar pelos sabores, ritmos e cores do continente mais vivo do planeta.",
                texto: "<p>Já sentiu o chão tremer com o ritmo de um tambor que parece bater no mesmo compasso que o seu coração? Já fechou os olhos e se deixou levar pelo aroma de um tempero que conta histórias de séculos atrás?</p>" +
                       "<p>A América do Sul não é apenas um lugar no mapa. É uma explosão de vida. É a força de um povo que transforma luta em festa, que coloca poesia na mesa e que dança como se o amanhã não existisse. Das cordilheiras gigantescas às praias que parecem não ter fim, nosso continente respira diversidade.</p>" +
                       "<p>Prepare o seu coração, porque a sua viagem pelo lado mais vibrante do planeta começa agora. <strong>Sinta a força. Viva a América do Sul.</strong></p>"
            }
        };

        function selecionarPais(pais) {
            paisSelecionado = pais;
            mudarCategoria('inicio');
        }

        function mudarCategoria(categoria) {
            var dados;
            if (paisSelecionado === "geral") {
                dados = conteudoGeral['inicio'];
            } else {
                // Prevenção caso clique em abas vazias antes de programar os países
                dados = { titulo: "Em construção", subtitulo: "Conteúdo em breve...", texto: "" };
            }

            document.getElementById("titulo-pagina").innerHTML = dados.titulo;
            document.getElementById("subtitulo-pagina").innerHTML = dados.subtitulo;
            document.getElementById("corpo-texto").innerHTML = dados.texto;
        }

        window.onload = function() {
            mudarCategoria('inicio');
        };
    </script>

</body>
</html>
